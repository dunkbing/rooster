[product]
name = Rooster
company = The Rooster Authors
# Internal-page scheme: rooster://settings, rooster://extensions, ...
scheme = rooster

[mac]
# Reverse-DNS identifier for a domain you control. Also names the
# profile directory, so changing it later orphans existing profiles.
bundle_id = com.example.rooster
# Apple Developer Team ID. Leave empty for unsigned local builds.
team_id =
